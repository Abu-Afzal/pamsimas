<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SiPAMS - PAMSIMAS Digital</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ==================== SIDEBAR ==================== -->
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-tint"></i> SiPAMS</h3>
            <p>PAMSIMAS Digital</p>
        </div>

        <!-- 1. INFO USER YANG LOGIN (Dinamis via JS) -->
        <div class="info-box user-info-box" id="userInfoBox" style="display: none;">
            <i class="fas fa-user-circle info-icon"></i>
            <div class="info-text">
                <div class="label">Login sebagai</div>
                <div class="value" id="currentUser">-</div>
                <div class="role-badge" id="currentRole">-</div>
            </div>
        </div>

        <!-- 2. INFO PERIODE & ZONA (Sesuai request Anda) -->
        <div class="info-box">
            <i class="fas fa-calendar-alt info-icon"></i>
            <div class="info-text">
                <div class="label">Periode Tagihan</div>
                <div class="value" id="periode-tagihan">-</div>
            </div>
        </div>
        <div class="info-box">
            <i class="fas fa-map-marker-alt info-icon"></i>
            <div class="info-text">
                <div class="label">Zona Aktif</div>
                <div class="value" id="zona-aktif">Zona 1 - Pusat</div>
            </div>
        </div>

        <!-- 3. MENU DINAMIS (Akan di-render oleh JS sesuai Role) -->
        <div class="menu-container" id="dynamic-sidebar-menu">
            <!-- Menu akan muncul otomatis setelah login -->
        </div>

        <div class="sidebar-footer">
            ©2026 SiPAMS<br>Air Mengalir, Laporan Mengalir
        </div
    </div>

    <!-- ==================== MAIN CONTENT ==================== -->
    <div class="main-content" id="mainContent">
        <div class="topbar">
            <button class="toggle-sidebar" onclick="toggleSidebar()">
                <i class="fas fa-bars"></i>
            </button>
            <div class="topbar-title">
                <h2 id="page-title">Selamat Datang di SiPAMS</h2>
                <p>Sistem Informasi PAMSIMAS Digital</p>
            </div>
            
            <!-- Tombol Aksi di Topbar -->
            <div class="topbar-actions" id="topbarActions" style="display: none;">
                <button class="btn-public" onclick="openPublicCheck()">
                    <i class="fas fa-search"></i> Cek Tagihan
                </button>
                <button class="btn-logout" onclick="logout()">
                    <i class="fas fa-sign-out-alt"></i> Keluar
                </button>
            </div>
        </div>

        <!-- WADAH DINAMIS UNTUK HALAMAN -->
        <div id="page-container">
            <!-- Konten dari folder 'pages' akan dimuat di sini -->
        </div>
    </div>

    <!-- ==================== MODAL CEK TAGIHAN PUBLIK ==================== -->
    <div class="modal-overlay" id="publicModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-search"></i> Cek Tagihan Pelanggan</h3>
                <button class="modal-close" onclick="closePublicCheck()">&times;</button>
            </div>
            <div class="modal-body">
                <p>Cari tagihan dengan memasukkan <strong>Nama</strong> atau <strong>Nomor Pelanggan</strong>.</p>
                <div class="search-box">
                    <input type="text" id="searchPelanggan" placeholder="Masukkan nama atau nomor...">
                    <button onclick="cariTagihan()"><i class="fas fa-search"></i> Cari</button>
                </div>
                <div id="hasilPencarian" class="hasil-pencarian"></div>
            </div>
        </div>
    </div>

    <!-- Load JavaScript Utama -->
    <script src="js/app.js"></script>
</body>
</html>
