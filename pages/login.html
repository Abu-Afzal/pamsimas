<div class="login-wrapper">
    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-tint login-logo"></i>
            <h2>SiPAMS</h2>
            <p>Sistem Informasi PAMSIMAS Digital</p>
        </div>

        <form id="formLogin" class="login-form">
            <div class="form-group">
                <label><i class="fas fa-user"></i> Username</label>
                <input type="text" id="username" placeholder="Masukkan username" required>
            </div>
            
            <div class="form-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <input type="password" id="password" placeholder="Masukkan password" required>
            </div>

            <div id="loginError" class="login-error"></div>

            <button type="submit" class="btn-login">
                <i class="fas fa-sign-in-alt"></i> Masuk
            </button>
        </form>

        <div class="login-info">
            <h4>🔑 Akun Demo (Prototype)</h4>
            <div class="demo-accounts">
                <div class="demo-item">
                    <span class="role-badge role-admin">ADMIN</span>
                    <code>admin / admin123</code>
                </div>
                <div class="demo-item">
                    <span class="role-badge role-ketua">KETUA</span>
                    <code>ketua / ketua123</code>
                </div>
                <div class="demo-item">
                    <span class="role-badge role-sekretaris">SEKRETARIS</span>
                    <code>sekretaris / sekretaris123</code>
                </div>
                <div class="demo-item">
                    <span class="role-badge role-bendahara">BENDAHARA</span>
                    <code>bendahara / bendahara123</code>
                </div>
                <div class="demo-item">
                    <span class="role-badge role-petugas">PETUGAS</span>
                    <code>petugas1 / petugas123</code>
                </div>
            </div>
        </div>
    </div>
</div>
