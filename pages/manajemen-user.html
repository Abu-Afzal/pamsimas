<div class="content-card">
    <h3><i class="fas fa-user-shield"></i> Manajemen Pengguna (Admin)</h3>
    <p>Buat akun untuk <strong>Ketua</strong>, <strong>Sekretaris</strong>, dan <strong>Bendahara</strong>.</p>

    <div class="user-management">
        <!-- Form Tambah User -->
        <div class="form-section">
            <h4>Tambah Pengguna Baru</h4>
            <form id="formTambahUser">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nama Lengkap</label>
                        <input type="text" id="namaUser" required>
                    </div>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="usernameUser" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="passwordUser" required>
                    </div>
                    <div class="form-group">
                        <label>Role</label>
                        <select id="roleUser" required>
                            <option value="">-- Pilih Role --</option>
                            <option value="ketua">Ketua</option>
                            <option value="sekretaris">Sekretaris</option>
                            <option value="bendahara">Bendahara</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-submit">
                    <i class="fas fa-plus"></i> Tambah Pengguna
                </button>
            </form>
        </div>

        <!-- Daftar User -->
        <div class="list-section">
            <h4>Daftar Pengguna</h4>
            <div id="daftarUser" class="user-list"></div>
        </div>
    </div>
</div>
