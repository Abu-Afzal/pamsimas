<div class="content-card">
    <h3>Pencatatan Meter (Petugas)</h3>
    <p>Silakan input angka meteran pelanggan di zona tugas Anda.</p>
    
    <div style="max-width: 500px; margin-top: 20px;">
        <div class="form-group">
            <label>Nomor Pelanggan</label>
            <input type="text" placeholder="Contoh: PLG-001">
        </div>
        <div class="form-group">
            <label>Nama Pelanggan</label>
            <input type="text" placeholder="Otomatis muncul (simulasi)" readonly style="background:#f9f9f9;">
        </div>
        <div class="form-group">
            <label>Angka Meter Saat Ini</label>
            <input type="number" placeholder="Masukkan angka meter">
        </div>
        <div class="form-group">
            <label>Foto Meteran (Bukti)</label>
            <input type="file" accept="image/*">
        </div>
        <button class="btn-submit"><i class="fas fa-save"></i> Simpan Pencatatan</button>
    </div>
</div>
