<div class="content-card">
    <h3><i class="fas fa-user-hard-hat"></i> Manajemen Petugas</h3>
    <p>Buat akun untuk <strong>Petugas Lapangan</strong> dan tentukan zona tugasnya.</p>

    <div class="user-management">
        <div class="form-section">
            <h4>Tambah Petugas Baru</h4>
            <form id="formTambahPetugas">
                <div class="form-row">
                    <div class="form-group">
                        <label>Nama Petugas</label>
                        <input type="text" id="namaPetugas" required>
                    </div>
                    <div class="form-group">
                        <label>Username</label>
                        <input type="text" id="usernamePetugas" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Password</label>
                        <input type="password" id="passwordPetugas" required>
                    </div>
                    <div class="form-group">
                        <label>Zona Tugas</label>
                        <select id="zonaPetugas" required>
                            <option value="">-- Pilih Zona --</option>
                            <option value="zona-1">Zona 1 - Pusat</option>
                            <option value="zona-2">Zona 2 - Utara</option>
                            <option value="zona-3">Zona 3 - Selatan</option>
                        </select>
                    </div>
                </div>
                <button type="submit" class="btn-submit">
                    <i class="fas fa-plus"></i> Tambah Petugas
                </button>
            </form>
        </div>

        <div class="list-section">
            <h4>Daftar Petugas</h4>
            <div id="daftarPetugas" class="user-list"></div>
        </div>
    </div>
</div>
